# Certbot armazena logs em: /var/log/letsencrypt/letsencrypt.log
# Documentação do Certbot: https://eff-certbot.readthedocs.io/en/stable/using.html

# Logs:         /etc/korp/certs/logs/letsencrypt.log
# Certificados: /etc/korp/certs/letsencrypt/live/portal-local.korp.com.br/

# Informações sobre o certificado: sudo certbot certificates --config-dir /etc/korp/certs/letsencrypt/
# Revocar certificado: sudo certbot revoke --cert-name portal-local.korp.com.br --config-dir /etc/korp/certs/letsencrypt/

# chave privada (private key) deve ser do tipo 'rsa' por causa do Viasoft.Authentication
# diretórios usados pelo certbot são customizados devido á permissões (logs-dir, config-dir, work-dir)
# 'cert-name' é o nome que o certbot irá utilizar para se resolver, não tem nenhum efeito no certificado em sí
# o challenge utilizado para validar o certificado é o 'http-01'
# O compose up logo antes pode ter recriado o nginx, que só atende depois que os containers de roteamento sobem.
# Uma validação com o nginx fora do ar conta para o limite do Let's Encrypt (5 falhas por domínio por hora).
- name: Espera do nginx na porta 80 para a validação do certbot
  ansible.builtin.uri:
    url: "http://127.0.0.1/.well-known/acme-challenge/korp-setup"
    headers:
      Host: "{{ dns.frontend }}"
    status_code: 404
  register: nginx_porta_80
  until: nginx_porta_80.status == 404
  retries: 30
  delay: 2

- name: Criação de certificado pelo Certbot 
  ansible.builtin.command:
    cmd: >
      certbot certonly 
      --webroot
      --webroot-path {{ config_dir_path }}/nginx/letsencrypt
      --logs-dir {{ certs_directory }}/logs
      --config-dir  {{ certs_directory }}/letsencrypt
      --work-dir {{ certs_directory }}/letsencrypt/lib
      --email {{ certs.certbot_automated.email }}
      --deploy-hook {{ korp_dir_path }}/scripts/certs_reload.sh
      --cert-name {{ certbot_cert_name }}
      -d {{ dns.api }} -d {{ dns.cdn }} -d {{ dns.frontend }} {{ '-d ' ~ dns.api_gateway if dns.api_gateway is defined and dns.api_gateway | length > 0 else '' }}
      --agree-tos
      --noninteractive
      --key-type rsa

- name: Remoção de cronjob padrão de certbot
  ansible.builtin.file:
    path: /etc/cron.d/certbot
    state: absent

- name: Geração de PFX do certificado
  community.crypto.openssl_pkcs12:
    action: export
    path: "{{ cert_pfx_path }}"
    passphrase: "{{ certs.pfx_passphrase }}"
    certificate_path: "{{ cert_crt_path }}"
    privatekey_path: "{{ cert_privatekey_path }}"
    friendly_name: portal-local.korp.com.br
    backup: true
  register: pfx_status

# files_and_folders_setup.yml mantém o certificado anterior no ssl_conf até o certificado do certbot existir
- name: Definição do ssl_conf com o certificado do Let's Encrypt
  ansible.builtin.set_fact:
    nginx_ssl_conf_transicao: false

- name: Configuração de ssl_conf do nginx com o certificado do Let's Encrypt
  ansible.builtin.template:
    dest: "{{ config_dir_path }}/nginx/ssl_conf"
    src: "configs/nginx/ssl_conf.j2"
    owner: "{{ linux_korp.user }}"
    group: root
    mode: '0644'
  register: nginx_ssl_conf_certbot_status

- name: Configuração e transferência de arquivos de nginx
  ansible.builtin.template:
    dest: "{{ config_dir_path }}/nginx/conf.d/{{ item }}"
    src: "configs/nginx/conf.d/{{ item }}.j2"
    owner: "{{ linux_korp.user }}"
    group: root
    mode: '0644'
  loop: "{{ nginx_conf_files }}"
  vars:
    nginx_conf_files: >-
      {{
        [
          "korp.conf",
          "korp-api.conf",
          "korp-cdn.conf",
          "korp.locations",
          "korp-api.locations",
          "korp-cdn.locations",
          "korp.ssl-locations",
          "korp-api.ssl-locations",
          "korp-cdn.ssl-locations"
        ]
        +
        (
          [
            "korp-api-gateway.conf",
            "korp-api-gateway.locations",
            "korp-api-gateway.ssl-locations"
          ]
          if dns.api_gateway | default('', true) | length > 0
          else []
        )
      }}
  register: nginx_files_status

# O ssl_conf é montado no container como arquivo: o template troca o inode e só um reinício enxerga o novo
- name: Reinício do container nginx com o certificado do Let's Encrypt
  ansible.builtin.import_tasks: nginx_restart.yml
  when: nginx_ssl_conf_certbot_status is changed

- name: Reload de nginx
  community.docker.docker_container_exec:
    container: nginx
    command: bash -c "/usr/sbin/nginx -s reload"
  when: nginx_files_status is changed and nginx_ssl_conf_certbot_status is not changed
