- name: Definição de variáveis
  ansible.builtin.set_fact:
    services: "{{ (lookup('ansible.builtin.template', 'vars/main.yml') | from_yaml)['services'] }}"

- name: Adição de serviços de FIS70
  ansible.builtin.include_role:
    name: utils
    tasks_from: services/add_service
  vars:
    service_name: "{{ item.key }}"
    id: FIS70
  with_dict: "{{ services }}"
  loop_control:
    extended: true

# A rota do portal para a tela (/fiscal/apuracao-cbs/) fica no korp.locations e no korp.ssl-locations, que a role
# infrastructure grava sem recarregar o nginx (fora do certbot). Com a configuração inválida, o reload mantém a anterior.
- name: Reload de nginx para a rota da tela de FIS70
  community.docker.docker_container_exec:
    container: nginx
    command: bash -c "/usr/sbin/nginx -s reload"
