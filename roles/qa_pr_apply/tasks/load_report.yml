---
- name: Ler relatório do MinIO
  ansible.builtin.uri:
    url: >-
      {{ qa_pr_minio_api }}/{{ qa_pr_minio_bucket }}/{{
        qa_pr_report_key | urlencode
      }}
    method: GET
    return_content: true
    validate_certs: true
  register: qa_pr_minio_report

- name: Validar e acumular relatório
  ansible.builtin.set_fact:
    qa_pr_reports: >-
      {{
        qa_pr_reports
        + [
            qa_pr_minio_report.content
            | qa_pr_load_report(
                qa_pr_link.repo,
                qa_pr_link.pr,
                qa_pr_report_key
              )
          ]
      }}
