# Agente 7.0: necessário para o AWX executar o korp-ops pelo Zabbix (comandos remotos em agente ativo)
- name: Instalação de pacote de zabbix
  ansible.builtin.apt:
    deb: "https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_7.0-2%2Bubuntu{{ ansible_facts['distribution_version'] | default('22.04') }}_all.deb"
    # O add-apt-repository do setup.sh reescreve todos os .list do apt, e o dpkg passa a tratar o zabbix.list como
    # alterado: com o padrão (force-confdef,force-confold) manteria o repositório 6.2 e gravaria o novo em .dpkg-dist
    dpkg_options: force-confnew
  register: zabbix_install_output
  ignore_errors: true

- name: Validação de instalação de zabbix
  ansible.builtin.fail:
      msg: "Erro durante instalação do zabbix: {{ zabbix_install_output.msg }}"
  when: zabbix_install_output.failed and not (zabbix_install_output.msg == "A later version is already installed" or zabbix_install_output.msg == "Uma versão mais atual já está instalada")

- name: Atualização de cache do repositório
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 1
    force_apt_get: true

- name: Instalação de zabbix-agent2
  ansible.builtin.apt:
    name: zabbix-agent2
    state: latest
  notify: Reinicio de zabbix-agent2

- name: Versão do zabbix-agent2
  ansible.builtin.command: zabbix_agent2 -V
  register: zabbix_agent2_version
  changed_when: false

# Sem o 7.0 o AWX não consegue executar o korp-ops (comandos remotos em agente ativo) e seguiria pelo salt sem aviso
- name: Validação da versão do zabbix-agent2
  ansible.builtin.fail:
    msg: >-
      zabbix-agent2 instalado não é o 7.0 ({{ zabbix_agent2_version.stdout_lines | first | default('') }}).
      Verifique o repositório em /etc/apt/sources.list.d/zabbix.list.
  when: zabbix_agent2_version.stdout is not search('[(]Zabbix[)] 7[.]0[.]')

# Única execução remota permitida ao agente (ver AllowKey em zabbix-agent.conf.j2)
- name: Instalação do korp-ops
  ansible.builtin.copy:
    src: scripts/korp-ops
    dest: /usr/local/sbin/korp-ops
    owner: root
    group: root
    mode: '0755'

- name: Permissão de sudo do zabbix somente para o korp-ops
  ansible.builtin.copy:
    content: "zabbix ALL=(root) NOPASSWD: /usr/local/sbin/korp-ops\n"
    dest: /etc/sudoers.d/korp-ops
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s

- name: Verificação de diretório de certs
  ansible.builtin.stat:
    path: "{{ korp_dir_path }}/certs/"
  register: korp_certs_folder

- name: Criação de diretório de certs
  ansible.builtin.file:
    path: "{{ korp_dir_path }}/certs/"
    state: directory
    mode: '0755'
    owner: "{{ linux_korp.user }}"
    group: root
  when: not korp_certs_folder.stat.exists

- name: Criação de arquivo de contendo a PSK de zabbix-agent2
  ansible.builtin.copy:
    dest: "{{ korp_dir_path }}/certs/zabbix.psk"
    owner: root
    group: zabbix
    mode: '0440'
    content: "{{ services_secrets.Others.Zabbix.PSK.Key }}"
  notify: Reinicio de zabbix-agent2

- name: Configuração de zabbix-agent2
  ansible.builtin.template:
    dest: "/etc/zabbix/zabbix_agent2.d/korp-default.conf"
    src: "configs/zabbix-agent.conf.j2"
    owner: "{{ linux_korp.user }}"
    group: root
    mode: '0644'
  notify: Reinicio de zabbix-agent2

- name: Alteração de visible name
  ansible.builtin.uri:
    url: "{{ gateway_url }}/vault/manager/server-deploy/zabbix/update-visible-name/{{ token }}" 
    status_code: 
      - 200
      - 201
