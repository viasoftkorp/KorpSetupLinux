# Instalado em /etc/zabbix/zabbix_agent2.d/korp-ops.conf pelo setup (zabbix_setup.yml) ou pelo
# scripts/migracao-zabbix/migrar-agente.sh. Fica fora do korp-default.conf para que um setup de uma branch
# sem o korp-ops (que reescreve o korp-default.conf) não desfaça a liberação.
#
# Comandos remotos: o AWX só pode executar o korp-ops (operações fechadas, argumentos validados).
# Os DenyKey de metacaracteres são uma camada extra; a proteção principal é a validação da entrada
# no script do servidor Zabbix, as contas do Zabbix e o sudo restrito ao korp-ops.
# A ordem importa: a primeira regra que casar com a chave decide.
DenyKey=system.run[*;*,*]
DenyKey=system.run[*|*,*]
DenyKey=system.run[*&*,*]
DenyKey=system.run[*`*,*]
DenyKey=system.run[*$*,*]
DenyKey=system.run[*>*,*]
DenyKey=system.run[*<*,*]
DenyKey=system.run[*(*,*]
DenyKey=system.run[*)*,*]
DenyKey=system.run[*{*,*]
DenyKey=system.run[*}*,*]
DenyKey=system.run[*\*,*]
DenyKey=system.run[*'*,*]
DenyKey=system.run[*"*,*]
AllowKey=system.run[sudo -n /usr/local/sbin/korp-ops *,*]
DenyKey=system.run[*]
