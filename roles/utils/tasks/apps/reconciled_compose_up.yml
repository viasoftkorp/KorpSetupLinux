# Executa docker compose com migração segura de identidades legadas.
#
# Variáveis obrigatórias:
#   compose_reconcile_project_src
#   compose_reconcile_project_name
#   compose_reconcile_files
#   compose_reconcile_env_files
#
# O módulo korp_compose_state resolve a configuração efetiva (mesmo `docker compose config` de antes)
# e verifica, apenas com leituras, se algum serviço está num estado que exige recuperação,
# reconciliação ou limpeza (container parcial, backup de migração, identidade conflitante,
# container legado). Os loops por serviço só são incluídos quando necessário e, quando rodam,
# são exatamente os mesmos de antes, para todos os serviços do compose.
# Com korp_setup_fast_path=false os loops sempre rodam (comportamento original).

- name: Resolução da configuração efetiva do compose e análise das identidades
  korp_compose_state:
    project_src: "{{ compose_reconcile_project_src }}"
    project_name: "{{ compose_reconcile_project_name }}"
    files: "{{ compose_reconcile_files }}"
    env_files: "{{ compose_reconcile_env_files }}"
    version: "{{ version_without_build }}"
    phase: pre
    migration_enabled: "{{ compose_migration_enabled | default(true) | bool }}"
    force_slow_path: "{{ not (korp_setup_fast_path | default(true) | bool) }}"
  register: compose_reconcile_state
  no_log: true

- name: Definição dos serviços efetivos do compose
  ansible.builtin.set_fact:
    compose_reconcile_services: "{{ compose_reconcile_state.services }}"
  no_log: true

# Tarefas de recuperação/reconciliação: só incluídas quando necessárias (needs_action também é true com
# korp_setup_fast_path=false). São as mesmas de antes, na mesma ordem (reconciled_compose_up_pre.yml).
- name: Recuperação e reconciliação de containers do compose
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/apps/reconciled_compose_up_pre.yml"
  when: compose_reconcile_state.needs_action

- name: Inicialização do compose reconciliado
  community.docker.docker_compose_v2:
    project_src: "{{ compose_reconcile_project_src }}"
    project_name: "{{ compose_reconcile_project_name }}"
    env_files: "{{ compose_reconcile_env_files }}"
    files: "{{ compose_reconcile_files }}"

- name: Análise de containers legados após a inicialização do compose
  korp_compose_state:
    project_src: "{{ compose_reconcile_project_src }}"
    project_name: "{{ compose_reconcile_project_name }}"
    files: "{{ compose_reconcile_files }}"
    env_files: "{{ compose_reconcile_env_files }}"
    version: "{{ version_without_build }}"
    phase: post
    services: "{{ compose_reconcile_services }}"
    force_slow_path: "{{ not (korp_setup_fast_path | default(true) | bool) }}"
  register: compose_reconcile_state_post
  no_log: true
  when: compose_migration_enabled | default(true) | bool

# Remoção de containers legados: só incluída quando necessária (reconciled_compose_up_post.yml).
- name: Remoção de containers legados ou parciais do compose
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/apps/reconciled_compose_up_post.yml"
  when: compose_reconcile_state_post.needs_action | default(false)
