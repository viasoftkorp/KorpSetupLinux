# Executa docker compose com migração segura de identidades legadas.
#
# Variáveis obrigatórias:
#   compose_reconcile_project_src
#   compose_reconcile_project_name
#   compose_reconcile_files
#   compose_reconcile_env_files

- name: Inicialização dos argumentos de resolução do compose
  ansible.builtin.set_fact:
    compose_reconcile_config_argv:
      - docker
      - compose
      - --ansi
      - never
      - --project-directory
      - "{{ compose_reconcile_project_src }}"
      - --project-name
      - "{{ compose_reconcile_project_name }}"

- name: Adição dos arquivos de ambiente aos argumentos do compose
  ansible.builtin.set_fact:
    compose_reconcile_config_argv: >-
      {{ compose_reconcile_config_argv + ['--env-file', compose_env_file] }}
  loop: "{{ compose_reconcile_env_files }}"
  loop_control:
    loop_var: compose_env_file

- name: Adição dos arquivos compose aos argumentos de resolução
  ansible.builtin.set_fact:
    compose_reconcile_config_argv: >-
      {{
        compose_reconcile_config_argv
        + [
          '--file',
          compose_file
          if compose_file.startswith('/')
          else compose_reconcile_project_src ~ '/' ~ compose_file
        ]
      }}
  loop: "{{ compose_reconcile_files }}"
  loop_control:
    loop_var: compose_file

- name: Resolução da configuração efetiva do compose
  ansible.builtin.command:
    argv: "{{ compose_reconcile_config_argv + ['config', '--format', 'json'] }}"
  register: compose_reconcile_config_result
  changed_when: false
  no_log: true

- name: Definição dos serviços efetivos do compose
  ansible.builtin.set_fact:
    compose_reconcile_services: >-
      {{ (compose_reconcile_config_result.stdout | from_json).services | default({}) }}
  no_log: true

- name: Recuperação de containers parciais sem identidade canônica
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/apps/recover_partial_compose_service.yml"
  loop: "{{ compose_reconcile_services | dict2items }}"
  loop_control:
    loop_var: compose_reconcile_service
    label: "{{ compose_reconcile_service.key }}"
  when: compose_migration_enabled | default(true) | bool

- name: Reconciliação de containers com nome físico conflitante
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/apps/reconcile_compose_service.yml"
  loop: "{{ compose_reconcile_services | dict2items }}"
  loop_control:
    loop_var: compose_reconcile_service
    label: "{{ compose_reconcile_service.key }}"
  when: compose_migration_enabled | default(true) | bool

- name: Inicialização do compose reconciliado
  community.docker.docker_compose_v2:
    project_src: "{{ compose_reconcile_project_src }}"
    project_name: "{{ compose_reconcile_project_name }}"
    env_files: "{{ compose_reconcile_env_files }}"
    files: "{{ compose_reconcile_files }}"

- name: Remoção segura de containers legados substituídos
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/apps/cleanup_legacy_compose_service.yml"
  loop: "{{ compose_reconcile_services | dict2items }}"
  loop_control:
    loop_var: compose_reconcile_service
    label: "{{ compose_reconcile_service.key }}"
  when: compose_migration_enabled | default(true) | bool
