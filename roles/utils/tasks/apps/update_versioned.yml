---
# Atualiza somente os AppIds versionados da versão corrente. Não usa a maior
# versão instalada, nem inclui aplicativos ou serviços não versionados.
- name: Atualização somente de aplicativos versionados
  block:
    - name: Leitura do mapeamento de aplicativos instalados
      ansible.builtin.set_fact:
        temp_apps_map: "{{ lookup('file', config_dir_path + '/installed_apps.yml') | from_yaml }}"

    - name: Normalização do mapeamento de aplicativos versionados
      ansible.builtin.set_fact:
        versioned_apps_map: "{{ temp_apps_map.versioned | default({}, true) }}"

    - name: Validação da versão registrada no mapeamento de aplicativos
      ansible.builtin.assert:
        that:
          - versioned_apps_map is mapping
          - version_without_build in versioned_apps_map
        fail_msg: >-
          A versão '{{ version_without_build }}' não está registrada em
          {{ config_dir_path }}/installed_apps.yml como aplicativos versionados.

    - name: Checagem dos composes versionados da versão corrente
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/roles/{{ app_name }}/templates/composes/{{ version_without_build }}/{{ app_name }}-compose.yml.j2"
      loop: "{{ versioned_apps_map[version_without_build] | default([]) | unique }}"
      loop_control:
        loop_var: app_name
      register: versioned_compose_results
      # Por algum motivo, o Ansible dá erro executando essa task como super user.
      become: false

    - name: Aviso sobre aplicativos sem compose versionado
      ansible.builtin.debug:
        msg: >-
          Ignorando {{ versioned_compose_result.app_name }}: não possui compose
          versionado para {{ version_without_build }}.
      loop: "{{ versioned_compose_results.results }}"
      loop_control:
        loop_var: versioned_compose_result
      when: not versioned_compose_result.stat.exists

    - name: Atualização dos aplicativos com compose versionado da versão corrente
      ansible.builtin.include_role:
        name: utils
        tasks_from: apps/install_versioned_only.yml
      loop: >-
        {{ versioned_compose_results.results
           | selectattr('stat.exists')
           | map(attribute='app_name')
           | list }}
      loop_control:
        loop_var: app_name
  # Necessário porque esta task é incluída dinamicamente por uma tag opt-in.
  tags: always
