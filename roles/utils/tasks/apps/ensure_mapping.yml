## passados para a task
# has_unversioned_services
# has_versioned_services
# has_exclusive_services

# Fast path (korp_setup_fast_path, padrão true): o mesmo apps_map em uma tarefa (filtro korp_apps_mapping).
# Com serviços só exclusivos, as tarefas originais (ensure_mapping_tasks.yml) também removem o app das
# versões anteriores e definem temp_apps_map/installed_version_list, então continuam sendo usadas.
- name: Definição do mapeamento de aplicativos com {{ id }}
  ansible.builtin.set_fact:
    apps_map: >-
      {{ lookup('file', config_dir_path ~ '/installed_apps.yml') | from_yaml
         | korp_apps_mapping(id, version_without_build, has_unversioned_services | bool,
                             (has_versioned_services or has_exclusive_services) | bool) }}
  when: korp_setup_fast_path | default(true) | bool and (has_versioned_services or not has_exclusive_services)

- name: Definição do mapeamento de aplicativos com {{ id }} (tarefas originais)
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/apps/ensure_mapping_tasks.yml"
  when: not (korp_setup_fast_path | default(true) | bool and (has_versioned_services or not has_exclusive_services))

- name: "Escrita de arquivo {{ config_dir_path }}/installed_apps.yml"
  ansible.builtin.copy:
    dest: "{{ config_dir_path }}/installed_apps.yml"
    mode: '0644'
    content: "{{ apps_map | to_yaml }}"
