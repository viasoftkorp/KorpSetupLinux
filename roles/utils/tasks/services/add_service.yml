# vars:
#   skip_compose - (bool) OPCIONAL
#   service_name - (string) OBRIGATÓRIO
#   id: - (string) OBRIGATÓRIO

# Esta task só acontece na primeira interação do loop
- name: "Startup de setup de role {{ id }}"
  ansible.builtin.include_role:
    name: utils
    tasks_from: services/startup
  when: ansible_loop.first

# Fast path (korp_setup_fast_path, padrão true): na primeira iteração todos os serviços do loop
# são cadastrados em lote (mesmo efeito das tarefas individuais abaixo, com poucas tarefas por role).
- name: "Cadastro em lote dos serviços de {{ id }}"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/services/add_services_batch.yml"
  when:
    - korp_setup_fast_path | default(true) | bool
    - ansible_loop.first

# Caminho original, serviço a serviço (korp_setup_fast_path=false)
- name: "Cadastro individual de {{ service_name }}"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/services/add_service_individual.yml"
  when: not (korp_setup_fast_path | default(true) | bool)

# essa task só acontece na ultima interação do loop
# isso é necessário pois a configuração de composes e o registro em installed_apps.yml, só deve acontecer uma vez, quando todos os serviços já estão configurados
- name: "Setup de composes e registro de {{ id }}"
  ansible.builtin.include_role:
    name: utils
    tasks_from: services/compose_and_mapping
  when: ansible_loop.last
