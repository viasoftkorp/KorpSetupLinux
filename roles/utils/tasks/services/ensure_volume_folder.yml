# ATENÇÃO: add_services_batch.yml (fast path) reproduz este arquivo em lote; ao alterar um, altere o outro.
- name: "Verificação de {{ volume_path }}"
  ansible.builtin.stat:
    path: "{{ volume_path }}"
  register: korp_volume_folder

- name: "Criação de diretórios {{ volume_path }}"
  ansible.builtin.file:
    path: "{{ volume_path }}"
    state: directory
    mode: '0755'
    owner: "{{ linux_korp.user }}"
    group: root
  when: not korp_volume_folder.stat.exists
