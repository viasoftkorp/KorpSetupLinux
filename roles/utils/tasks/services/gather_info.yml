# Fast path (korp_setup_fast_path, padrão true): as mesmas informações de gather_info_tasks.yml em duas
# tarefas. Os templates estão no próprio host (connection: local), então a existência é verificada no
# controlador, sem o módulo stat (mesmo formato de resultado), e as listas que as tarefas com with_dict
# acumulavam são calculadas pelo filtro korp_service_lists.
- name: Checagem de composes de {{ id }}
  ansible.builtin.set_fact:
    versioned_compose_result: >-
      {{ (playbook_dir ~ '/roles/' ~ id ~ '/templates/composes/' ~ version_without_build ~ '/' ~ id
          ~ '-compose.yml.j2') | korp_path_stat }}
    unversioned_compose_result: >-
      {{ (playbook_dir ~ '/roles/' ~ id ~ '/templates/composes/' ~ id ~ '-compose.yml.j2') | korp_path_stat }}
  when: korp_setup_fast_path | default(true) | bool

# `services` como em gather_info_tasks.yml: a variável da tarefa só vale se não houver um fact services
- name: Definição dos serviços e versões de {{ id }}
  vars:
    services: "{{ (lookup('ansible.builtin.template', '~/roles/{{ id }}/vars/main.yml') | from_yaml)['services'] }}"
    korp_service_lists_result: >-
      {{ ((lookup('ansible.builtin.template', unversioned_compose_result.stat.path) | from_yaml).services
          if unversioned_compose_result.stat.exists else {}) | korp_service_lists(services) }}
  ansible.builtin.set_fact:
    exclusive_services_list: "{{ korp_service_lists_result.exclusive }}"
    unversioned_services_list: "{{ korp_service_lists_result.unversioned }}"
    has_versioned_services: "{{ versioned_compose_result.stat.exists }}"
    has_unversioned_services: "{{ korp_service_lists_result.unversioned | length > 0 }}"
    has_exclusive_services: "{{ korp_service_lists_result.exclusive | length > 0 }}"
  when: korp_setup_fast_path | default(true) | bool

- name: Leitura das informações gerais de {{ id }} (tarefas originais)
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/services/gather_info_tasks.yml"
  when: not (korp_setup_fast_path | default(true) | bool)
