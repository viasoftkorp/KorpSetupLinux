---
- name: Teste de integração da migração de identidade Compose
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    version_without_build: "2025.1.0"
    compose_migration_enabled: true
    compose_migration_validation_retries: 2
    compose_migration_validation_delay: 1
    test_project_src: "{{ playbook_dir }}"
    test_container_name: devo7182-compose-migration-test
    test_backup_name: devo7182-compose-migration-test-legacy-compose-migration
    cleanup_legacy_name: devo7182-cleanup-test
    cleanup_target_name: devo7182-cleanup-test-2025.1.0
    unsafe_container_name: devo7182-unsafe-test
    rollback_container_name: devo7182-rollback-test
    rollback_backup_name: devo7182-rollback-test-legacy-compose-migration

  tasks:
    - name: Execução do cenário
      block:
        - name: Limpeza preventiva do container de teste
          community.docker.docker_container:
            name: "{{ item }}"
            state: absent
          loop:
            - "{{ test_container_name }}"
            - "{{ test_backup_name }}"

        - name: Criação da identidade legada
          community.docker.docker_compose_v2:
            project_src: "{{ test_project_src }}"
            project_name: devo7182-old
            files:
              - old-compose.yml

        - name: Migração para a identidade canônica
          ansible.builtin.include_role:
            name: utils
            tasks_from: apps/reconciled_compose_up
          vars:
            compose_reconcile_project_src: "{{ test_project_src }}"
            compose_reconcile_project_name: devo7182-new
            compose_reconcile_env_files: []
            compose_reconcile_files:
              - new-compose.yml

        - name: Inspeção do container migrado
          community.docker.docker_container_info:
            name: "{{ test_container_name }}"
          register: migrated_container

        - name: Validação da identidade migrada
          ansible.builtin.assert:
            that:
              - migrated_container.exists
              - migrated_container.container.State.Running
              - migrated_container.container.Config.Labels['com.docker.compose.project'] == 'devo7182-new'
              - migrated_container.container.Config.Labels['com.docker.compose.service'] == 'service-with-hyphens'

        - name: Segunda execução para validação de idempotência
          ansible.builtin.include_role:
            name: utils
            tasks_from: apps/reconciled_compose_up
          vars:
            compose_reconcile_project_src: "{{ test_project_src }}"
            compose_reconcile_project_name: devo7182-new
            compose_reconcile_env_files: []
            compose_reconcile_files:
              - new-compose.yml

        - name: Inspeção do possível backup residual
          community.docker.docker_container_info:
            name: "{{ test_backup_name }}"
          register: residual_backup

        - name: Validação da ausência de backup residual
          ansible.builtin.assert:
            that:
              - not residual_backup.exists

        - name: Criação do par legado com nome não versionado
          community.docker.docker_compose_v2:
            project_src: "{{ test_project_src }}"
            project_name: devo7182-pair-old
            files:
              - legacy-pair-old.yml

        - name: Subida do substituto e limpeza do legado
          ansible.builtin.include_role:
            name: utils
            tasks_from: apps/reconciled_compose_up
          vars:
            compose_reconcile_project_src: "{{ test_project_src }}"
            compose_reconcile_project_name: devo7182-pair-new
            compose_reconcile_env_files: []
            compose_reconcile_files:
              - legacy-pair-new.yml

        - name: Inspeção do legado removido
          community.docker.docker_container_info:
            name: "{{ cleanup_legacy_name }}"
          register: removed_legacy

        - name: Inspeção do substituto versionado
          community.docker.docker_container_info:
            name: "{{ cleanup_target_name }}"
          register: versioned_replacement

        - name: Validação do par legado/versionado
          ansible.builtin.assert:
            that:
              - not removed_legacy.exists
              - versioned_replacement.exists
              - versioned_replacement.container.State.Running
              - versioned_replacement.container.Config.Labels['com.docker.compose.project'] == 'devo7182-pair-new'
              - versioned_replacement.container.Config.Labels['com.docker.compose.service'] == 'cleanup-service-2025-1-0'

        - name: Criação de container que não corresponde à imagem desejada
          community.docker.docker_compose_v2:
            project_src: "{{ test_project_src }}"
            project_name: devo7182-unsafe-old
            files:
              - unsafe-old.yml

        - name: Tentativa fail-closed com imagem incompatível
          block:
            - name: Execução da reconciliação incompatível
              ansible.builtin.include_role:
                name: utils
                tasks_from: apps/reconciled_compose_up
              vars:
                compose_reconcile_project_src: "{{ test_project_src }}"
                compose_reconcile_project_name: devo7182-unsafe-new
                compose_reconcile_env_files: []
                compose_reconcile_files:
                  - unsafe-new.yml

            - name: Falha caso a reconciliação incompatível seja aceita
              ansible.builtin.fail:
                msg: A reconciliação deveria rejeitar imagens incompatíveis.
          rescue:
            - name: Registro da rejeição esperada
              ansible.builtin.set_fact:
                unsafe_reconciliation_rejected: true

        - name: Inspeção do container incompatível preservado
          community.docker.docker_container_info:
            name: "{{ unsafe_container_name }}"
          register: preserved_unsafe_container

        - name: Validação do comportamento fail-closed
          ansible.builtin.assert:
            that:
              - unsafe_reconciliation_rejected | default(false)
              - preserved_unsafe_container.exists
              - preserved_unsafe_container.container.State.Running
              - preserved_unsafe_container.container.Config.Image == 'nginx:latest'
              - preserved_unsafe_container.container.Config.Labels['com.docker.compose.project'] == 'devo7182-unsafe-old'

        - name: Criação do container que será restaurado
          community.docker.docker_compose_v2:
            project_src: "{{ test_project_src }}"
            project_name: devo7182-rollback-old
            files:
              - rollback-old.yml

        - name: Tentativa de migração cujo novo container falha
          block:
            - name: Execução da migração com falha esperada
              ansible.builtin.include_role:
                name: utils
                tasks_from: apps/reconciled_compose_up
              vars:
                compose_reconcile_project_src: "{{ test_project_src }}"
                compose_reconcile_project_name: devo7182-rollback-new
                compose_reconcile_env_files: []
                compose_reconcile_files:
                  - rollback-new.yml

            - name: Falha caso o novo container inválido seja aceito
              ansible.builtin.fail:
                msg: A migração deveria restaurar o container anterior.
          rescue:
            - name: Registro do rollback esperado
              ansible.builtin.set_fact:
                rollback_was_triggered: true

        - name: Inspeção do container restaurado
          community.docker.docker_container_info:
            name: "{{ rollback_container_name }}"
          register: restored_container

        - name: Inspeção do backup após rollback
          community.docker.docker_container_info:
            name: "{{ rollback_backup_name }}"
          register: rollback_backup

        - name: Validação do rollback
          ansible.builtin.assert:
            that:
              - rollback_was_triggered | default(false)
              - restored_container.exists
              - restored_container.container.State.Running
              - restored_container.container.Config.Labels['com.docker.compose.project'] == 'devo7182-rollback-old'
              - restored_container.container.Config.Labels['com.docker.compose.service'] == 'rollback.old'
              - not rollback_backup.exists

      always:
        - name: Remoção dos containers do teste
          community.docker.docker_container:
            name: "{{ item }}"
            state: absent
          loop:
            - "{{ test_container_name }}"
            - "{{ test_backup_name }}"
            - "{{ cleanup_legacy_name }}"
            - "{{ cleanup_target_name }}"
            - "{{ unsafe_container_name }}"
            - "{{ rollback_container_name }}"
            - "{{ rollback_backup_name }}"

        - name: Remoção das redes do teste
          ansible.builtin.command:
            argv:
              - docker
              - network
              - rm
              - "{{ item }}"
          loop:
            - devo7182-old_default
            - devo7182-new_default
            - devo7182-pair-old_default
            - devo7182-pair-new_default
            - devo7182-unsafe-old_default
            - devo7182-unsafe-new_default
            - devo7182-rollback-old_default
            - devo7182-rollback-new_default
          changed_when: false
          failed_when: false
